<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="images/StopwatchIconBG.png" type="image/x-icon" />
  </head>
  <body>
    <div class="container">
      <div class="timer">
        <span class="digit" id="hr">00</span>
        <span class="txt">:</span>
        <span class="digit" id="min">00</span>
        <span class="txt">:</span>
        <span class="digit" id="sec">00</span>
        <span class="txt"></span>
        <span class="digit" id="count">00</span>
        <div class="buttons">
          <button class="btn" id="start">Start</button>
          <button class="btn" id="stop">Stop</button>
          <button class="btn" id="reset">Reset</button>
        </div>
      </div>
      <div class="new-button" id="new-button">
        <button class="new-category-button">New Category</button>
      </div>
      <!-- Category start -->
      <div class="category-container">
        <div class="category" id="category0">
          <div class="color-icon" id="color-icon0"></div>
          <input
            type="text"
            name="category-input"
            id="category-input0"
            class="category-input"
            placeholder="Enter up to 20 characters"
            maxlength="20"
          />
          <div
            class="buttons"
            style="margin: 0px; justify-content: center; align-items: center"
          >
            <button class="btn category-btn" id="start0">Start</button>
            <button class="btn category-btn" id="stop0">Stop</button>
            <button class="btn category-btn" id="reset0">Reset</button>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
