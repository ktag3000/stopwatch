<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="images/StopwatchIconBG.png" type="image/x-icon" />
  </head>
  <body>
    <div class="container">
      <div class="timer">
        <span class="digit" id="hr">00</span>
        <span class="txt">:</span>
        <span class="digit" id="min">00</span>
        <span class="txt">:</span>
        <span class="digit" id="sec">00</span>
        <span class="txt"></span>
        <span class="digit" id="count">00</span>
        <div class="buttons">
          <button class="btn" id="start">Start</button>
          <button class="btn" id="stop">Stop</button>
          <button class="btn" id="reset">Reset</button>
        </div>
      </div>
      <div class="new-button" id="new-button">
        <button class="new-category-button">New Category</button>
      </div>
      <!-- Category start -->
      <div class="category-container">
        <div
          class="category"
          id="category0"
          style="display: none; margin-top: 20px; gap: 10px"
        >
          <div
            class="color-icon"
            id="color-icon0"
            style="
              display: flex;
              align-self: center;
              width: 20px;
              height: 20px;
              border: 1px solid red;
              border-radius: 50%;
              background-color: red;
              position: relative;
            "
          ></div>
          <input
            type="text"
            name="category-input"
            id="category-input0"
            class="category-input"
            style="font-size: 1rem; padding: 0.5%; border-radius: 5px"
            placeholder="Enter up to 20 characters"
            maxlength="20"
          />
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
