<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="images/StopwatchIconBG.png" type="image/x-icon" />
  </head>
  <body>
    <div class="container">
      <div class="timer">
        <span class="digit" id="hr">00</span>
        <span class="txt">:</span>
        <span class="digit" id="min">00</span>
        <span class="txt">:</span>
        <span class="digit" id="sec">00</span>
        <span class="txt"></span>
        <span class="digit" id="count">00</span>
        <div class="buttons">
          <button class="btn" id="start">Start</button>
          <button class="btn" id="stop">Stop</button>
          <button class="btn" id="reset">Reset</button>
        </div>
      </div>
      <div class="new-button" id="new-button">
        <button class="new-category-button">New Category</button>
      </div>
      <!-- Parent Category start -->
      <div
        class="category-container"
        id="category-container"
        style="display: flex; margin-top: 20px; gap: 10px; display: none"
      >
        <div
          class="color-icon"
          id="color-icon0"
          style="
            align-self: center;
            width: 20px;
            height: 20px;
            border: 1px solid red;
            border-radius: 50%;
            background-color: red;
            position: relative;
          "
        >
          <img
            src="/Images/X (1).png"
            width="20px"
            alt="X icon"
            class="hover-icon"
            style="display: none"
          />
        </div>
        <input
          type="text"
          name="category-name"
          id="category0"
          class="category-name"
          style="font-size: 1rem; padding: 0.5%; border-radius: 5px"
          placeholder="Enter up to 20 characters"
          maxlength="20"
        />
      </div>
      <!-- End Parent Category -->

      <!-- id="cloned-category0" is the first category created -->
      <!-- Empty div to give the correct spacing when JS creates the cloned elements -->
      <!-- Gets renamed for eached clone -->
      <div class="cloned-category" id="cloned-category0"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
